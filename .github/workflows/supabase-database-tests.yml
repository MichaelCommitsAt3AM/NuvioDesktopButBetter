name: Supabase Database Tests

on:
  pull_request:
    paths:
      - "composeApp/src/**/*.kt"
      - "scripts/check_supabase_rpc_contracts.py"
      - "scripts/test-supabase-migration-upgrade.sh"
      - "supabase/**"
      - ".github/workflows/supabase-database-tests.yml"
  push:
    branches:
      - Dev
    paths:
      - "composeApp/src/**/*.kt"
      - "scripts/check_supabase_rpc_contracts.py"
      - "scripts/test-supabase-migration-upgrade.sh"
      - "supabase/**"
      - ".github/workflows/supabase-database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpc-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check client RPC migration coverage
        run: python scripts/check_supabase_rpc_contracts.py

  fresh-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          # Pinned deliberately. The CLI version selects the supabase/postgres
          # image, and that image's default privileges decide whether the
          # "anonymous clients cannot ..." assertions in
          # supabase/tests/database/device_and_library_delta.test.sql hold.
          # 2.115.0 -> postgres 17.6.1.159 (green); 2.116.0 -> 17.6.1.165, which
          # grants anon EXECUTE by default and fails those tests. Re-pin only
          # after confirming the tests still pass on the newer image.
          version: 2.115.0
          github-token: ${{ github.token }}
      - name: Start Supabase and apply every migration
        run: supabase start
      - name: Run database contract tests
        run: supabase test db
      - name: Run PostgREST RPC smoke test
        run: bash scripts/test-supabase-rpc-api.sh
      - name: Stop database
        if: always()
        run: supabase stop --no-backup

  upgrade-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          # Pinned deliberately. The CLI version selects the supabase/postgres
          # image, and that image's default privileges decide whether the
          # "anonymous clients cannot ..." assertions in
          # supabase/tests/database/device_and_library_delta.test.sql hold.
          # 2.115.0 -> postgres 17.6.1.159 (green); 2.116.0 -> 17.6.1.165, which
          # grants anon EXECUTE by default and fails those tests. Re-pin only
          # after confirming the tests still pass on the newer image.
          version: 2.115.0
          github-token: ${{ github.token }}
      - name: Exercise migration over existing library data
        run: bash scripts/test-supabase-migration-upgrade.sh
