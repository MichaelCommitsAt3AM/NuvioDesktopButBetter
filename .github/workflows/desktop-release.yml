name: Build Desktop Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build artifacts, validate a release, create a draft, or publish
        required: true
        type: choice
        options:
          - build-only
          - dry-run
          - draft
          - publish
        default: dry-run
      target:
        description: Platforms to build in build-only mode
        required: true
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
          - flatpak
        default: all
      exclude_commits:
        description: Optional comma-separated commit hashes to omit from the notes
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: desktop-release-${{ github.ref }}-${{ inputs.mode == 'build-only' && inputs.target || 'release' }}
  cancel-in-progress: false

jobs:
  metadata:
    name: ${{ inputs.mode }} ${{ inputs.target }} desktop release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.version }}
      release_commit: ${{ steps.release.outputs.release_commit }}
      current_bump: ${{ steps.release.outputs.current_bump }}
      previous_bump: ${{ steps.release.outputs.previous_bump }}
      matrix: ${{ steps.matrix.outputs.value }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Read release metadata
        id: release
        env:
          VERSION_FILE: composeApp/Configuration/DesktopVersion.properties
          VERSION_KEY: VERSION_NAME
          VERSION_FIRST_PARENT: "true"
        run: ./scripts/release-metadata.sh "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Validate release state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.version }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          if [[ "${RELEASE_REF_TYPE}" != "branch" ]]; then
            echo "Releases must be dispatched from a branch, not ${RELEASE_REF_TYPE}." >&2
            exit 1
          fi

          if [[ "${RELEASE_MODE}" != "build-only" && "${RELEASE_TARGET}" != "all" ]]; then
            echo "Release validation, draft, and publish modes require target=all." >&2
            exit 1
          fi

          if [[ "${RELEASE_MODE}" != "build-only" ]]; then
            if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              echo "Tag ${RELEASE_TAG} already exists." >&2
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "A GitHub release for ${RELEASE_TAG} already exists." >&2
              exit 1
            fi

            unexpected_changes="$(
              git diff --name-only "${CURRENT_BUMP}..${RELEASE_COMMIT}" \
                | grep -Ev '^(\.github/workflows/desktop-release\.yml|scripts/linux/nuvio-flatpak\.yml|scripts/(generate-release-notes|release-metadata)\.sh|scripts/desktop-ui/(release-(config|manifest|matrix)\.mjs|release\.test\.mjs|bundle-java\.mjs|collect-release-assets\.mjs|configure-runtime\.mjs|configure-updater-signing\.ps1|package-flatpak\.sh|package-windows-setup\.ps1|verify-windows-msi\.ps1)|.*\.md)$' \
                || true
            )"
            if [[ -n "${unexpected_changes}" ]]; then
              echo "The desktop version bump must be the final application change before release." >&2
              echo "Unexpected files changed after the bump:" >&2
              echo "${unexpected_changes}" >&2
              exit 1
            fi
          fi

      - name: Generate repository release notes
        if: inputs.mode != 'build-only'
        env:
          PREVIOUS_BUMP: ${{ steps.release.outputs.previous_bump }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
        run: |
          if ! ./scripts/generate-release-notes.sh \
            --from "${PREVIOUS_BUMP}" \
            --to "${CURRENT_BUMP}" \
            --repository "${GITHUB_REPOSITORY}" \
            --repository-history \
            --exclude "${EXCLUDE_COMMITS}" \
            > release-notes.md; then
            # PR attribution is optional. GitHub API outages must not block
            # packaging when the full commit history is already checked out.
            echo "::warning::GitHub PR lookup failed; generating notes from local history."
            ./scripts/generate-release-notes.sh \
              --from "${PREVIOUS_BUMP}" \
              --to "${CURRENT_BUMP}" \
              --repository "${GITHUB_REPOSITORY}" \
              --repository-history \
              --offline \
              --exclude "${EXCLUDE_COMMITS}" \
              > release-notes.md
          fi

          if [[ ! -s release-notes.md ]]; then
            # Feature branches can contain every user-facing commit while the
            # first-parent range contains only merge commits and version bumps.
            ./scripts/generate-release-notes.sh \
              --from "${PREVIOUS_BUMP}" \
              --to "${CURRENT_BUMP}" \
              --repository "${GITHUB_REPOSITORY}" \
              --offline \
              --exclude "${EXCLUDE_COMMITS}" \
              > release-notes.md
          fi

          if [[ ! -s release-notes.md ]]; then
            echo "No desktop repository release-note commits were found." >&2
            exit 1
          fi

          {
            echo "## ${{ steps.release.outputs.version }} desktop release notes"
            echo
            cat release-notes.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release notes
        if: inputs.mode != 'build-only'
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-desktop-${{ steps.release.outputs.version }}-release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

      - name: Select rewrite builds
        id: matrix
        env:
          RELEASE_TARGET: ${{ inputs.target }}
        run: echo "value=$(node scripts/desktop-ui/release-matrix.mjs "$RELEASE_TARGET")" >> "$GITHUB_OUTPUT"
      - name: Test release packaging contracts
        run: node --test scripts/desktop-ui/release.test.mjs

  build:
    name: Rewrite ${{ matrix.platform }} ${{ matrix.arch }} ${{ matrix.format }}
    if: inputs.mode != 'dry-run'
    needs: metadata
    runs-on: ${{ matrix.runner }}
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}
      NUVIO_UPDATER_PUBLIC_KEY: ${{ vars.NUVIO_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.NUVIO_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.NUVIO_UPDATER_PRIVATE_KEY_PASSWORD }}
      NUVIO_PACKAGE_FORMAT: ${{ matrix.format }}
      WEBVIEW2_VERSION: 1.0.4078.44
      APPIMAGE_EXTRACT_AND_RUN: '1'
      SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-ui/src-tauri -> target
          cache-on-failure: true
      - name: Configure release inputs
        run: |
          test -n "$NUVIO_UPDATER_PUBLIC_KEY" || { echo 'Set desktop-release variable NUVIO_UPDATER_PUBLIC_KEY.' >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Set desktop-release secret NUVIO_UPDATER_PRIVATE_KEY.' >&2; exit 1; }
          node scripts/desktop-ui/configure-runtime.mjs
          node scripts/desktop-ui/release-config.mjs "$NUVIO_PACKAGE_FORMAT"
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: bash scripts/linux/install-desktop-build-dependencies.sh librsvg2-dev libayatana-appindicator3-dev rpm zsync
      - name: Install Windows WebView2 SDK
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version $env:WEBVIEW2_VERSION -OutputDirectory "$env:RUNNER_TEMP\nuget" -DirectDownload -NonInteractive -NoCache
          $sdkRoot = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          if (-not (Test-Path (Join-Path $sdkRoot 'build\native\x64\WebView2Loader.dll.lib'))) { throw 'WebView2 SDK is missing' }
          "WEBVIEW2_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Windows WebView2 Runtime
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
          $installation = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
          $runtimeKeys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $runtime = $runtimeKeys | ForEach-Object { Get-ItemProperty -LiteralPath $_ -Name pv -ErrorAction SilentlyContinue } |
            Where-Object { $_.pv -and $_.pv -ne '0.0.0.0' } | Select-Object -First 1
          if (-not $runtime) { throw "WebView2 Runtime is unavailable (installer exit $($installation.ExitCode))" }
          Write-Host "WebView2 Runtime $($runtime.pv)"
      - name: Install frontend dependencies and test
        working-directory: desktop-ui
        run: |
          npm ci
          npm test -- --maxWorkers=1
          npm run contract:check
          NUVIO_VALIDATE_TAURI_SCHEMA=1 node --test ../scripts/desktop-ui/release.test.mjs
      - name: Stage Kotlin backend
        id: backend
        run: |
          gradle_args=(:composeApp:stageBridgeRuntime :composeApp:desktopTest --tests 'com.nuvio.desktop.bridge.*' --no-configuration-cache --no-daemon --stacktrace)
          if [[ "$RUNNER_OS" == Windows ]]; then
            gradle_args+=("-Pnuvio.webview2.dir=$WEBVIEW2_ROOT")
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a ./gradlew "${gradle_args[@]}"
          else
            ./gradlew "${gradle_args[@]}"
          fi
          node scripts/desktop-ui/bundle-java.mjs
      - name: Upload failed backend test reports
        if: failure() && steps.backend.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.format }}
          path: composeApp/build/test-results/desktopTest/*.xml
          if-no-files-found: warn
      - name: Check Rust shell
        working-directory: desktop-ui/src-tauri
        run: |
          cargo fmt --check
          cargo test --locked
      - name: Build signed rewrite packages
        working-directory: desktop-ui
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            export DEPLOY_GTK_VERSION=3
            java_runtime="$PWD/src-tauri/resources/backend/runtime"
            export LD_LIBRARY_PATH="$java_runtime/lib:$java_runtime/lib/server${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          node node_modules/@tauri-apps/cli/tauri.js build --verbose --ci --config src-tauri/tauri.release.conf.json
      - name: Build Flatpak
        if: matrix.format == 'flatpak'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder desktop-file-utils
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --system flathub org.gnome.Platform//50 org.gnome.Sdk//50
          bash scripts/desktop-ui/package-flatpak.sh
      - name: Verify and collect release assets
        id: collect
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: node scripts/desktop-ui/collect-release-assets.mjs "$NUVIO_PACKAGE_FORMAT" "$RELEASE_ARCH"
      - name: Verify Windows upgrade package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem release-assets -Filter '*.msi')
          if ($packages.Count -ne 1) { throw 'Exactly one Windows MSI is required.' }
          ./scripts/desktop-ui/verify-windows-msi.ps1 -Path $packages[0].FullName
      - name: Verify Linux package identity
        if: matrix.format == 'deb' || matrix.format == 'rpm'
        run: |
          if [[ "$NUVIO_PACKAGE_FORMAT" == deb ]]; then
            test "$(dpkg-deb -f release-assets/*.deb Package)" == nuvio
          else
            test "$(rpm -qp --queryformat '%{NAME}' release-assets/*.rpm)" == nuvio
          fi
      - name: Verify macOS disk image and packaged runtime
        if: matrix.platform == 'macos'
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          hdiutil verify release-assets/*.dmg
          mountpoint="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" release-assets/*.dmg
          trap 'hdiutil detach "$mountpoint"' EXIT
          app="$mountpoint/Nuvio.app"
          test -x "$app/Contents/MacOS/Nuvio"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" == com.nuvio.media.desktop
          lipo "$app/Contents/MacOS/Nuvio" -verify_arch "$RELEASE_ARCH"
          classpath="$(find "$app/Contents/Resources" -name classpath.txt -print -quit)"
          test -n "$classpath"
          backend="$(dirname "$classpath")"
          find "$backend/native" -name libplayer_bridge.dylib -print | grep -q .
          "$backend/runtime/bin/java" -version
          smoke="$(mktemp)"
          if (cd "$backend" && "$backend/runtime/bin/java" -cp "$(cat classpath.txt)" com.nuvio.desktop.bridge.MainKt </dev/null) >"$smoke" 2>&1; then
            echo 'The packaged backend unexpectedly accepted an empty token.' >&2
            exit 1
          fi
          grep -q 'Missing bridge token on stdin' "$smoke"
      - uses: actions/upload-artifact@v7
        if: always() && !cancelled() && steps.collect.outcome == 'success'
        with:
          name: nuvio-desktop-${{ needs.metadata.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.format }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create ${{ inputs.mode }} rewrite release
    if: inputs.mode != 'build-only' && inputs.mode != 'dry-run' && inputs.target == 'all'
    needs: [metadata, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.release_commit }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: nuvio-desktop-${{ needs.metadata.outputs.version }}-*
          path: release
          merge-multiple: true
      - name: Generate signed update feed and checksums
        run: |
          node scripts/desktop-ui/release-manifest.mjs release
          test -s "release/Nuvio-Linux-x86_64-$RELEASE_VERSION.flatpak"
          test -s "release/Nuvio-macOS-arm64-$RELEASE_VERSION.dmg"
          test -s "release/Nuvio-macOS-x86_64-$RELEASE_VERSION.dmg"
          (cd release && find . -maxdepth 1 -type f ! -name release-notes.md ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs -d '\n' sha256sum) > release/SHA256SUMS.txt
      - name: Create GitHub release
        run: |
          assets=()
          while IFS= read -r -d '' asset; do assets+=("$asset"); done < <(find release -maxdepth 1 -type f ! -name release-notes.md -print0)
          args=("$RELEASE_VERSION" --target "$RELEASE_COMMIT" --title "Nuvio $RELEASE_VERSION" --notes-file release/release-notes.md)
          if [[ "$RELEASE_MODE" == draft ]]; then args+=(--draft); else args+=(--latest); fi
          gh release create --repo "$GITHUB_REPOSITORY" "${args[@]}" "${assets[@]}"
