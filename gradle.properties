#Kotlin
kotlin.code.style=official
# Heaps sized to fit a typical 16 GB dev machine. The previous values
# (Gradle 12G + Kotlin 8G + Native 16G) exceeded total RAM, causing the Gradle
# daemon to be evicted between runs and forcing a slow cold start every launch.
kotlin.daemon.jvmargs=-Xmx4096M
kotlin.native.jvmArgs=-Xmx4096M
kotlin.mpp.enableCInteropCommonization=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
